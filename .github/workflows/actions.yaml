name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build and test backend
    runs-on: ubuntu-latest

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/code_editor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234578

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 1234578
          MYSQL_DATABASE: code_editor
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p1234578 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Grant execute permission to mvnw
        run: chmod +x ./mvnw

      - name: Verify MySQL is reachable
        run: |
          timeout 120s bash -c 'until mysqladmin ping -h 127.0.0.1 -uroot -p1234578 --silent; do
            sleep 2
          done'

      - name: Run tests
        run: ./mvnw -B test

      - name: Build package
        run: ./mvnw -B clean package -DskipTests

      - name: Build and Push Docker Image
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          image: koreoyonde/deployments
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}